<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Taylor Tourek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+S+Guides:ital@0;1&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --page-x: 42px;
      --page-top: 28px;
      --page-bottom: 34px;
      --header-space: 128px;

      --hand-font: "Playwrite GB S Guides", cursive;
      --serif-font: "Cormorant Garamond", serif;

      /* Desktop scale: 1 real-life cm = this many screen pixels */

      --home-cm-scale: 7.2px;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #ffffff url('./white_wall.jpg') center center / cover fixed no-repeat;
    }

    body {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background: #ffffff url('./white_wall.jpg') center center / cover fixed no-repeat;
      color: #111111;
      font-family: var(--sans-font);
    }

    .page {
      min-height: 100vh;
      background: transparent;
      transition: opacity 360ms ease, filter 360ms ease, transform 360ms ease;
    }

    body.lightbox-open .page {
      opacity: 0;
      filter: blur(2px);
      transform: scale(0.995);
      pointer-events: none;
    }

    header {
      position: fixed;
      top: var(--page-top);
      left: var(--page-x);
      right: var(--page-x);
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    header a {
      pointer-events: auto;
    }

    .title {
      font-family: var(--serif-font);
      font-size: clamp(34px, 4.8vw, 68px);
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 0.98;
      color: rgba(30, 20, 14, 0.72);
      text-decoration: none;
      cursor: pointer;
      text-shadow:
        0.3px 0.3px 0 rgba(255, 255, 255, 0.56),
        0 0 0.7px rgba(32, 20, 12, 0.16);
    }

    nav {
      display: flex;
      gap: 22px;
      padding-top: 12px;
      font-family: var(--sans-font);
      font-size: clamp(11px, 0.86vw, 14px);
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(30, 20, 14, 0.68);
      text-shadow:
        0.25px 0.25px 0 rgba(255, 255, 255, 0.56),
        0 0 0.6px rgba(32, 20, 12, 0.14);
    }

    nav a {
      color: inherit;
      text-decoration: none;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 180ms ease;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    main {
      position: relative;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .view {
      height: 100%;
      display: none;
      overflow: hidden;
      background: transparent;
    }

    .view.active {
      display: flex;
    }

    #home {
      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      cursor: pointer;
    }

    .frontpage-work {
      display: flex;
      flex-direction: column;

      max-width: 92vw;

    .image-wrap {

      overflow: hidden;
      background: #f4f4f4;

      transition: width 320ms ease, aspect-ratio 320ms ease, box-shadow 220ms ease;
    }

    .image-wrap.png-clean {
      background: transparent;

      overflow: visible;
    }

    .image-wrap img,
    .work-item img {

      display: block;
      filter: none;
    }

    .image-wrap.png-clean img,
    .work-item.png-clean img {
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: contrast(1.06);
    }

    .frontpage-caption,
    .work-caption {
      font-family: var(--hand-font);
      font-style: normal;

      line-height: 1.05;
      letter-spacing: -0.085em;
      text-align: center;
      color: rgba(30, 20, 14, 0.62);
      background:
        radial-gradient(circle at 12% 26%, rgba(58, 38, 24, 0.26) 0 1px, transparent 1.8px),
        radial-gradient(circle at 58% 62%, rgba(22, 16, 12, 0.18) 0 0.8px, transparent 1.6px),
        linear-gradient(
          115deg,
          rgba(42, 25, 14, 0.76) 0%,
          rgba(23, 18, 14, 0.58) 28%,
          rgba(72, 48, 30, 0.46) 48%,
          rgba(18, 13, 10, 0.68) 72%,
          rgba(60, 38, 24, 0.52) 100%
        );
      background-size: 13px 11px, 17px 15px, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0.35px 0.35px 0 rgba(255, 255, 255, 0.58),
        -0.35px -0.35px 0 rgba(0, 0, 0, 0.12),
        0 0 0.7px rgba(32, 20, 12, 0.14);
      mix-blend-mode: multiply;
    }

    .frontpage-caption {
      margin-top: 12px;
      font-size: clamp(16.5px, 1.58vw, 25.5px);
      max-width: min(70vw, 760px);
      transform: rotate(-0.4deg);
    }

    #work {
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 0 var(--page-x) 0;
    }

    #work::-webkit-scrollbar {
      width: 8px;
    }

    #work::-webkit-scrollbar-track {
      background: transparent;
    }

    #work::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.14);
      border-radius: 999px;
    }

    .work-grid {
      width: min(100%, 1480px);
      min-height: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 38px 42px;
      padding: calc(var(--header-space) + 18px) 16px 70px;
      overflow: visible;
    }

    .work-entry {
      width: calc(var(--display-w-cm) * var(--cm-scale));
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .work-item {
      width: 100%;
      aspect-ratio: var(--display-ratio);
      overflow: hidden;
      background: #f4f4f4;
      box-shadow: 12px 14px 28px rgba(0, 0, 0, 0.13), 3px 4px 9px rgba(0, 0, 0, 0.075);
      cursor: zoom-in;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .work-item:hover {
      transform: translateY(-2px);
      box-shadow: 16px 18px 34px rgba(0, 0, 0, 0.14), 4px 5px 10px rgba(0, 0, 0, 0.075);
    }

    .work-item:focus-visible {
      outline: 1px solid rgba(0, 0, 0, 0.45);
      outline-offset: 5px;
    }

    .work-item.png-clean {
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .work-item.png-clean:hover {
      transform: none;
      box-shadow: none;
    }

    .work-caption {
      margin-top: 8px;
      font-size: clamp(9px, 0.56vw, 12px);
      max-width: 100%;
      transform: rotate(-0.2deg);
    }

    .work-title {
      display: block;
      text-transform: uppercase;
    }

    .work-details {
      display: block;
      margin-top: 3px;
    }

    .simple-page {
      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      font-family: var(--hand-font);
      font-size: clamp(24px, 3vw, 42px);
      font-weight: 400;
      letter-spacing: -0.085em;
      color: rgba(30, 20, 14, 0.68);
      mix-blend-mode: multiply;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 32px;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 320ms ease, visibility 0s;
    }

    .lightbox__image {
      max-width: min(84vw, 1120px);
      max-height: 84vh;
      object-fit: contain;
      display: block;
      cursor: zoom-out;
      box-shadow: 18px 22px 46px rgba(0, 0, 0, 0.16), 5px 7px 14px rgba(0, 0, 0, 0.08);
      transform: scale(0.955) translateY(12px);
      opacity: 0;
      transition: transform 360ms cubic-bezier(.2,.8,.2,1), opacity 300ms ease;
    }

    .lightbox.is-open .lightbox__image {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox__close {
      position: fixed;
      top: 24px;
      right: 28px;
      border: 0;
      background: transparent;
      color: rgba(30, 20, 14, 0.68);
      font-family: var(--sans-font);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transition: opacity 220ms ease;
      mix-blend-mode: multiply;
    }

    .lightbox.is-open .lightbox__close {
      opacity: 0.78;
    }

    .lightbox__close:hover {
      opacity: 1;
    }

    body.lightbox-open {
      overflow: hidden;
    }

    @media (max-width: 1100px) {
      :root {
        --cm-scale: 5.7px;

        height: auto;
        min-height: 100svh;

      }

      .view {
        min-height: 100svh;
        height: auto;
      }

      #home {
        min-height: 100svh;

        padding-bottom: 36px;
      }

      .image-wrap {
        max-width: 86vw;
        max-height: 62svh;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.11), 0 3px 8px rgba(0, 0, 0, 0.07);
      }

      .image-wrap.png-clean {
        box-shadow: none;
      }

      .frontpage-caption {
        font-size: clamp(15px, 4.8vw, 22.5px);
        max-width: min(82vw, 420px);
      }

      .frontpage-caption,
      .work-caption,
      .title,
      nav,
      .simple-page {
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        -webkit-text-fill-color: currentColor;
        text-shadow: 0.25px 0.25px 0 rgba(255, 255, 255, 0.52), 0 0 0.45px rgba(32, 20, 12, 0.12);
      }

      .work-grid {

      }

      .work-item:hover {
        transform: none;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12), 0 3px 8px rgba(0, 0, 0, 0.07);
      }

      .work-item.png-clean:hover {
        box-shadow: none;
      }

      .work-caption {
        font-size: clamp(10px, 3.1vw, 12.5px);
        max-width: min(78vw, 340px);
      }

      }

      .lightbox {

      .lightbox__image {
        max-width: 88vw;

      }

      .lightbox__close {
        top: max(18px, env(safe-area-inset-top));

      }
    }

    @media (max-width: 420px) {
      :root {
        --page-x: 18px;
        --header-space: 136px;
        --cm-scale: 2.95px;
        --home-cm-scale: 2.95px;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }

      .image-wrap {
        max-width: 84vw;
        max-height: 58svh;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="title" href="#home" data-view="home">Taylor Tourek</a>
      <nav aria-label="Main navigation">
        <a href="#contact" data-view="contact">Contact</a>
        <a href="#cv" data-view="cv">CV</a>
        <a href="#work" data-view="work">Work</a>
      </nav>
    </header>

    <main>
      <section id="home" class="view active" aria-label="Home">
        <div class="frontpage-work">
          <div class="image-wrap">
            <img alt="" />
          </div>
          <p class="frontpage-caption"></p>
        </div>
      </section>

      <section id="contact" class="view simple-page" aria-label="Contact">
        <p>Contact</p>
      </section>

      <section id="cv" class="view simple-page" aria-label="CV">
        <p>CV</p>
      </section>

      <section id="work" class="view" aria-label="Work">
        <div class="work-grid" id="workGrid"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__close" type="button">Close</button>
    <img class="lightbox__image" alt="" />
  </div>

  <script>
    const works = [
      {
        title: 'BUILDING A FIRE',
        year: '2025',
        imageBase: 'building_a_fire',
        widthCm: 50.8,
        heightCm: 40.64
      },
      {
        title: 'CLOUD MOVING FASTER THAN THEY DID YESTERDAY',
        year: '2025',
        imageBase: 'cloud_moving_faster_than_they_did_yesterday',
        widthCm: 20.32,
        heightCm: 20.32
      },
      {
        title: 'MAKING YOU UNDERSTAND EXACTLY',
        year: '2025',
        imageBase: 'making_you_understand_exactly',
        widthCm: 30.48,
        heightCm: 30.48,
        displayWidthCm: 45.72,
        displayHeightCm: 45.72,
        pngClean: true
      },
      {
        title: 'DIALOGUE 1',
        year: '2025',
        imageBase: 'dialogue_1',
        widthCm: 101.6,
        heightCm: 72
      },
      {
        title: 'HANDWRITTEN NOTE',
        year: '2025',
        imageBase: 'handwritten_note',
        widthCm: 30.48,
        heightCm: 30.48
      },
      {
        title: 'LYING OFTEN',
        year: '2025',
        imageBase: 'lying_often',
        widthCm: 30.48,
        heightCm: 30.48
      },
      {
        title: 'DARIA',
        year: '2025',
        imageBase: 'daria',
        widthCm: 101,
        heightCm: 101
      },
      {
        title: 'MOUTH OPEN WIDE FOR NOTHING IMPORTANT',
        year: '2025',
        imageBase: 'mouth_open_wide_for_nothing_important',
        widthCm: 76.2,
        heightCm: 60.96
      },
      {
        title: 'ONE TIME ONLY',
        year: '2025',
        imageBase: 'one_time_only',
        widthCm: 60.96,
        heightCm: 60.96
      }
    ];

    const imageExtensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG'];

    function formatCm(value) {
      return Number.isInteger(value) ? String(value) : String(value).replace(/\.?0+$/, '');
    }

    function workLabel(work) {
      return `${work.title}, ${work.year}`;
    }

    function workSizeText(work) {
      return `${formatCm(work.widthCm)} × ${formatCm(work.heightCm)} cm`;
    }

    function displayWidth(work) {
      return work.displayWidthCm || work.widthCm;
    }

    function displayHeight(work) {
      return work.displayHeightCm || work.heightCm;
    }

    function applyRealSize(element, work) {
      element.style.setProperty('--display-w-cm', displayWidth(work));
      element.style.setProperty('--display-h-cm', displayHeight(work));
      element.style.setProperty('--display-ratio', `${displayWidth(work)} / ${displayHeight(work)}`);
    }

    function loadImageBase(img, base) {
      if (!img || !base) return;

      img.dataset.imgBase = base;
      let index = 0;

      function tryNextImage() {
        if (index >= imageExtensions.length) {
          console.warn(`Could not load image for: ${base}`);
          img.removeEventListener('error', tryNextImage);
          return;
        }

        img.src = `./${base}.${imageExtensions[index]}`;
        index += 1;
      }

      if (img._tryNextImage) {
        img.removeEventListener('error', img._tryNextImage);
      }

      img._tryNextImage = tryNextImage;
      img.addEventListener('error', tryNextImage);
      tryNextImage();
    }

    function createWorkEntry(work) {
      const entry = document.createElement('div');
      entry.className = 'work-entry';
      applyRealSize(entry, work);

      const item = document.createElement('div');
      item.className = `work-item${work.pngClean ? ' png-clean' : ''}`;
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `View ${work.title} larger`);

      const img = document.createElement('img');
      img.alt = work.title;
      loadImageBase(img, work.imageBase);

      item.appendChild(img);

      const caption = document.createElement('p');
      caption.className = 'work-caption';

      const title = document.createElement('span');
      title.className = 'work-title';
      title.textContent = workLabel(work);

      const details = document.createElement('span');
      details.className = 'work-details';
      details.textContent = workSizeText(work);

      caption.appendChild(title);
      caption.appendChild(details);

      entry.appendChild(item);
      entry.appendChild(caption);

      item.addEventListener('click', () => {
        openLightbox(img);
      });

      item.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(img);
        }
      });

      return entry;
    }

    const links = document.querySelectorAll('[data-view]');
    const views = document.querySelectorAll('.view');

    function showView(viewName) {
      views.forEach((view) => {
        view.classList.toggle('active', view.id === viewName);
      });

      links.forEach((link) => {
        link.classList.toggle('active', link.dataset.view === viewName);
      });

      history.replaceState(null, '', '#' + viewName);
    }

    links.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        showView(link.dataset.view);
      });
    });

    const workGrid = document.querySelector('#workGrid');
    works.forEach((work) => {
      workGrid.appendChild(createWorkEntry(work));
    });

    const homeView = document.querySelector('#home');
    const frontpageWrap = document.querySelector('.image-wrap');
    const frontpageImage = document.querySelector('#home img');
    const frontpageCaption = document.querySelector('.frontpage-caption');

    let currentFrontpageIndex = 0;
    let frontpageTimer;

    function showFrontpageWork(index) {
      const work = works[index];
      if (!work) return;

      currentFrontpageIndex = index;

      applyRealSize(frontpageWrap, work);
      frontpageWrap.classList.toggle('png-clean', Boolean(work.pngClean));

      loadImageBase(frontpageImage, work.imageBase);
      frontpageImage.alt = work.title;
      frontpageCaption.textContent = workLabel(work);
    }

    function nextFrontpageWork() {
      showFrontpageWork((currentFrontpageIndex + 1) % works.length);
    }

    function restartFrontpageTimer() {
      clearInterval(frontpageTimer);
      frontpageTimer = setInterval(nextFrontpageWork, 8000);
    }

    if (homeView && frontpageImage && frontpageCaption && frontpageWrap) {
      showFrontpageWork(0);
      restartFrontpageTimer();

      homeView.addEventListener('click', (event) => {
        if (event.target.closest('a')) return;
        nextFrontpageWork();
        restartFrontpageTimer();
      });
    }

    window.addEventListener('load', () => {
      const startingView = window.location.hash.replace('#', '') || 'home';
      if (document.getElementById(startingView)) {
        showView(startingView);
      }
    });

    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = document.querySelector('.lightbox__image');
    const lightboxClose = document.querySelector('.lightbox__close');

    function openLightbox(sourceImage) {
      if (!sourceImage || !sourceImage.currentSrc) return;

      lightboxImage.src = sourceImage.currentSrc;
      lightboxImage.alt = sourceImage.alt || '';
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lightbox-open');
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
    }

    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', closeLightbox);

    lightboxImage.addEventListener('click', (event) => {
      event.stopPropagation();
      closeLightbox();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
        closeLightbox();
      }
    });
  </script>
