<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Taylor Tourek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+S+Guides:ital@0;1&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --page-x: 42px;
      --page-top: 28px;
      --page-bottom: 34px;
      --header-space: 128px;
      --hand-font: "Playwrite GB S Guides", cursive;
      --serif-font: "Cormorant Garamond", serif;
      --sans-font: "Inter", sans-serif;

      /* Controls how large real-life cm appear on screen. */
      --cm-scale: 7.2px;
      --home-cm-scale: 7.2px;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #ffffff url('./white_wall.jpg') center center / cover fixed no-repeat;
    }

    body {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background: #ffffff url('./white_wall.jpg') center center / cover fixed no-repeat;
      color: #111111;
      font-family: var(--sans-font);
    }

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--page-x);
      background: #ffffff url('./white_wall.jpg') center center / cover fixed no-repeat;
      transition: opacity 520ms ease, visibility 0s linear 520ms;
    }

    .preloader__text {
      font-family: var(--hand-font);
      font-size: clamp(24px, 3vw, 42px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.085em;
      text-align: center;
      color: rgba(30, 20, 14, 0.62);
      background:
        radial-gradient(circle at 12% 26%, rgba(58, 38, 24, 0.26) 0 1px, transparent 1.8px),
        radial-gradient(circle at 58% 62%, rgba(22, 16, 12, 0.18) 0 0.8px, transparent 1.6px),
        linear-gradient(
          115deg,
          rgba(42, 25, 14, 0.76) 0%,
          rgba(23, 18, 14, 0.58) 28%,
          rgba(72, 48, 30, 0.46) 48%,
          rgba(18, 13, 10, 0.68) 72%,
          rgba(60, 38, 24, 0.52) 100%
        );
      background-size: 13px 11px, 17px 15px, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0.35px 0.35px 0 rgba(255, 255, 255, 0.58),
        -0.35px -0.35px 0 rgba(0, 0, 0, 0.12),
        0 0 0.7px rgba(32, 20, 12, 0.14);
      mix-blend-mode: multiply;
      transform: rotate(-0.4deg);
    }

    body.is-ready .preloader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body.is-loading .page {
      opacity: 0;
      pointer-events: none;
    }

    .page {
      min-height: 100vh;
      background: transparent;
      transition: opacity 360ms ease, filter 360ms ease, transform 360ms ease;
    }

    body.lightbox-open .page {
      opacity: 0;
      filter: blur(2px);
      transform: scale(0.995);
      pointer-events: none;
    }

    header {
      position: fixed;
      top: var(--page-top);
      left: var(--page-x);
      right: var(--page-x);
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    header a {
      pointer-events: auto;
    }

    .title {
      font-family: var(--serif-font);
      font-size: clamp(34px, 4.8vw, 68px);
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 0.98;
      color: rgba(30, 20, 14, 0.72);
      text-decoration: none;
      cursor: pointer;
      text-shadow:
        0.3px 0.3px 0 rgba(255, 255, 255, 0.56),
        0 0 0.7px rgba(32, 20, 12, 0.16);
    }

    nav {
      display: flex;
      gap: 22px;
      padding-top: 12px;
      font-family: var(--sans-font);
      font-size: clamp(11px, 0.86vw, 14px);
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(30, 20, 14, 0.68);
      text-shadow:
        0.25px 0.25px 0 rgba(255, 255, 255, 0.56),
        0 0 0.6px rgba(32, 20, 12, 0.14);
    }

    nav a {
      color: inherit;
      text-decoration: none;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 180ms ease;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    main {
      position: relative;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .view {
      height: 100%;
      display: none;
      overflow: hidden;
      background: transparent;
    }

    .view.active {
      display: flex;
    }

    #home {
      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      cursor: pointer;
    }

    .frontpage-work {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 92vw;
    }

    .image-wrap {
      width: calc(var(--display-w-cm) * var(--home-cm-scale));
      max-width: 86vw;
      background: transparent;
      overflow: visible;
      box-shadow: 14px 16px 30px rgba(0, 0, 0, 0.115), 3px 4px 9px rgba(0, 0, 0, 0.07);
    }

    .image-wrap.png-clean,
    .work-item.png-clean {
      background: transparent;
      box-shadow: none;
    }

    .frontpage-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: initial;
      object-position: center center;
    }

    .image-wrap.trim-right {
      overflow: hidden;
    }

    .image-wrap.trim-right .frontpage-image {
      width: calc(100% + 2px);
      max-width: none;
      transform: translateX(-1px);
    }

    .work-item img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      filter: blur(8px);
      transform: scale(1.01);
      transition: opacity 420ms ease, filter 520ms ease, transform 520ms ease;
    }

    .work-item img.is-loaded {
      opacity: 1;
      filter: none;
      transform: scale(1);
    }

    .image-wrap.png-clean img,
    .work-item.png-clean img {
      mix-blend-mode: multiply;
    }

    .frontpage-caption,
    .work-caption {
      font-family: var(--hand-font);
      font-style: normal;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.085em;
      text-align: center;
      color: rgba(30, 20, 14, 0.62);
      background:
        radial-gradient(circle at 12% 26%, rgba(58, 38, 24, 0.26) 0 1px, transparent 1.8px),
        radial-gradient(circle at 58% 62%, rgba(22, 16, 12, 0.18) 0 0.8px, transparent 1.6px),
        linear-gradient(
          115deg,
          rgba(42, 25, 14, 0.76) 0%,
          rgba(23, 18, 14, 0.58) 28%,
          rgba(72, 48, 30, 0.46) 48%,
          rgba(18, 13, 10, 0.68) 72%,
          rgba(60, 38, 24, 0.52) 100%
        );
      background-size: 13px 11px, 17px 15px, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0.35px 0.35px 0 rgba(255, 255, 255, 0.58),
        -0.35px -0.35px 0 rgba(0, 0, 0, 0.12),
        0 0 0.7px rgba(32, 20, 12, 0.14);
      mix-blend-mode: multiply;
    }

    .frontpage-caption {
      margin-top: 12px;
      font-size: clamp(16.5px, 1.58vw, 25.5px);
      max-width: min(70vw, 760px);
      transform: rotate(-0.4deg);
    }

    #work {
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 0 var(--page-x) 0;
    }

    #work::-webkit-scrollbar {
      width: 8px;
    }

    #work::-webkit-scrollbar-track {
      background: transparent;
    }

    #work::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.14);
      border-radius: 999px;
    }

    .work-grid {
      width: min(100%, 1480px);
      min-height: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 38px 42px;
      padding: calc(var(--header-space) + 18px) 16px 70px;
      overflow: visible;
    }

    .work-entry {
      width: calc(var(--display-w-cm) * var(--cm-scale));
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .work-item {
      width: 100%;
      background: transparent;
      box-shadow: 12px 14px 28px rgba(0, 0, 0, 0.13), 3px 4px 9px rgba(0, 0, 0, 0.075);
      cursor: zoom-in;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .work-item:hover {
      transform: translateY(-2px);
      box-shadow: 16px 18px 34px rgba(0, 0, 0, 0.14), 4px 5px 10px rgba(0, 0, 0, 0.075);
    }

    .work-item.png-clean:hover {
      transform: none;
      box-shadow: none;
    }

    .work-item:focus-visible {
      outline: 1px solid rgba(0, 0, 0, 0.45);
      outline-offset: 5px;
    }

    .work-caption {
      margin-top: 8px;
      font-size: clamp(9px, 0.56vw, 12px);
      max-width: 100%;
      transform: rotate(-0.2deg);
    }

    .work-title {
      display: block;
      text-transform: uppercase;
    }

    .work-details {
      display: block;
      margin-top: 3px;
    }


    .contact-page {
      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      font-family: var(--hand-font);
      color: rgba(30, 20, 14, 0.68);
      mix-blend-mode: multiply;
    }

    .contact-card {
      width: min(520px, 86vw);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      transform: rotate(-0.25deg);
    }

    .contact-heading {
      font-size: clamp(28px, 3.4vw, 48px);
      line-height: 1;
      letter-spacing: -0.085em;
      text-align: center;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      font-family: var(--sans-font);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contact-form label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: rgba(30, 20, 14, 0.62);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      border: 1px solid rgba(30, 20, 14, 0.26);
      background: rgba(255, 255, 255, 0.22);
      color: #111111;
      font-family: var(--sans-font);
      font-size: 14px;
      line-height: 1.4;
      padding: 10px 11px;
      outline: none;
      resize: vertical;
      box-shadow: 3px 4px 9px rgba(0, 0, 0, 0.035);
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: rgba(30, 20, 14, 0.48);
    }

    .contact-form button {
      align-self: center;
      margin-top: 4px;
      border: 0;
      background: transparent;
      color: rgba(30, 20, 14, 0.68);
      font-family: var(--hand-font);
      font-size: clamp(18px, 1.7vw, 27px);
      letter-spacing: -0.085em;
      cursor: pointer;
      text-shadow: 0.35px 0.35px 0 rgba(255, 255, 255, 0.58), -0.35px -0.35px 0 rgba(0, 0, 0, 0.12);
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: clamp(16px, 1.4vw, 23px);
      line-height: 1.05;
      letter-spacing: -0.085em;
      text-align: center;
    }

    .contact-links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    .simple-page {
      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      font-family: var(--hand-font);
      font-size: clamp(24px, 3vw, 42px);
      font-weight: 400;
      letter-spacing: -0.085em;
      color: rgba(30, 20, 14, 0.68);
      mix-blend-mode: multiply;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 32px;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 320ms ease, visibility 0s;
    }

    .lightbox__inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vw, 42px);
      max-width: 94vw;
      max-height: 86vh;
      transform: scale(0.955) translateY(12px);
      opacity: 0;
      transition: transform 360ms cubic-bezier(.2,.8,.2,1), opacity 300ms ease;
    }

    .lightbox.is-open .lightbox__inner {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox__image {
      max-width: min(76vw, 1120px);
      max-height: 84vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      cursor: zoom-out;
      box-shadow: 18px 22px 46px rgba(0, 0, 0, 0.16), 5px 7px 14px rgba(0, 0, 0, 0.08);
    }

    .lightbox__meta {
      min-width: 160px;
      max-width: 250px;
      font-family: var(--hand-font);
      font-style: normal;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.085em;
      color: rgba(30, 20, 14, 0.62);
      background:
        radial-gradient(circle at 12% 26%, rgba(58, 38, 24, 0.26) 0 1px, transparent 1.8px),
        radial-gradient(circle at 58% 62%, rgba(22, 16, 12, 0.18) 0 0.8px, transparent 1.6px),
        linear-gradient(
          115deg,
          rgba(42, 25, 14, 0.76) 0%,
          rgba(23, 18, 14, 0.58) 28%,
          rgba(72, 48, 30, 0.46) 48%,
          rgba(18, 13, 10, 0.68) 72%,
          rgba(60, 38, 24, 0.52) 100%
        );
      background-size: 13px 11px, 17px 15px, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0.35px 0.35px 0 rgba(255, 255, 255, 0.58),
        -0.35px -0.35px 0 rgba(0, 0, 0, 0.12),
        0 0 0.7px rgba(32, 20, 12, 0.14);
      mix-blend-mode: multiply;
      transform: rotate(-0.35deg);
    }

    .lightbox__meta-title {
      display: block;
      font-size: clamp(16px, 1.5vw, 26px);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .lightbox__meta-size {
      display: block;
      font-size: clamp(14px, 1.2vw, 21px);
      margin-top: 6px;
    }

    .lightbox__close {
      position: fixed;
      top: 24px;
      right: 28px;
      border: 0;
      background: transparent;
      color: rgba(30, 20, 14, 0.68);
      font-family: var(--sans-font);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transition: opacity 220ms ease;
      mix-blend-mode: multiply;
    }

    .lightbox.is-open .lightbox__close {
      opacity: 0.78;
    }

    .lightbox__close:hover {
      opacity: 1;
    }

    body.lightbox-open {
      overflow: hidden;
    }

      :root {

      }

      :root {
        --page-x: 30px;

      align-items: center;
      justify-content: center;
      padding: var(--header-space) var(--page-x) var(--page-bottom);
      font-family: var(--hand-font);
      color: rgba(30, 20, 14, 0.68);
      mix-blend-mode: multiply;
    }

    .contact-card {
      width: min(520px, 86vw);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      transform: rotate(-0.25deg);
    }

    .contact-heading {
      font-size: clamp(28px, 3.4vw, 48px);
      line-height: 1;
      letter-spacing: -0.085em;
      text-align: center;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      font-family: var(--sans-font);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contact-form label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: rgba(30, 20, 14, 0.62);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      border: 1px solid rgba(30, 20, 14, 0.26);
      background: rgba(255, 255, 255, 0.22);
      color: #111111;
      font-family: var(--sans-font);
      font-size: 14px;
      line-height: 1.4;
      padding: 10px 11px;
      outline: none;
      resize: vertical;
      box-shadow: 3px 4px 9px rgba(0, 0, 0, 0.035);
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: rgba(30, 20, 14, 0.48);
    }

    .contact-form button {
      align-self: center;
      margin-top: 4px;
      border: 0;
      background: transparent;
      color: rgba(30, 20, 14, 0.68);
      font-family: var(--hand-font);
      font-size: clamp(18px, 1.7vw, 27px);
      letter-spacing: -0.085em;
      cursor: pointer;
      text-shadow: 0.35px 0.35px 0 rgba(255, 255, 255, 0.58), -0.35px -0.35px 0 rgba(0, 0, 0, 0.12);
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: clamp(16px, 1.4vw, 23px);
      line-height: 1.05;
      letter-spacing: -0.085em;
      text-align: center;
    }

    .contact-links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    .simple-page {
        min-height: 100svh;
        padding-top: var(--header-space);
      }

      .lightbox {
        padding: 24px;
      }

      .lightbox__inner {
        flex-direction: column;
        gap: 14px;
        max-height: 86svh;
      }

      .lightbox__image {
        max-width: 88vw;
        max-height: 68svh;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.14), 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .lightbox__meta {
        max-width: 86vw;
        text-align: center;
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        -webkit-text-fill-color: currentColor;
        text-shadow: 0.25px 0.25px 0 rgba(255, 255, 255, 0.52), 0 0 0.45px rgba(32, 20, 12, 0.12);
      }

      .lightbox__close {
        top: max(18px, env(safe-area-inset-top));
        right: 22px;
      }
    }

    @media (max-width: 420px) {
      :root {
        --page-x: 18px;
        --header-space: 136px;
        --cm-scale: 2.95px;
        --home-cm-scale: 2.95px;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }

      .image-wrap {
        max-width: 84vw;
        max-height: 58svh;
      }
    }
  </style>
</head>

<body class="is-loading">
  <div class="preloader" aria-live="polite" aria-label="Loading artworks">
    <p class="preloader__text">Loading works</p>
  </div>

  <div class="page">
    <header>
      <a class="title" href="#home" data-view="home">Taylor Tourek</a>
      <nav aria-label="Main navigation">
        <a href="#contact" data-view="contact">Contact</a>
        <a href="#cv" data-view="cv">CV</a>
        <a href="#work" data-view="work">Work</a>
      </nav>
    </header>

    <main>
      <section id="home" class="view active" aria-label="Home">
        <div class="frontpage-work">
          <div class="image-wrap">
            <img class="frontpage-image" alt="" fetchpriority="high" />
          </div>
          <p class="frontpage-caption"></p>
        </div>
      </section>

      <section id="contact" class="view contact-page" aria-label="Contact">
        <div class="contact-card">
          <p class="contact-heading">Contact</p>

          <form class="contact-form" action="mailto:tctourek@gmail.com" method="post" enctype="text/plain">
            <label>
              <span>Name</span>
              <input type="text" name="name" autocomplete="name" />
            </label>

            <label>
              <span>Email</span>
              <input type="email" name="email" autocomplete="email" />
            </label>

            <label>
              <span>Message</span>
              <textarea name="message" rows="5"></textarea>
            </label>

            <button type="submit">Send</button>
          </form>

          <p class="contact-links">
            <a href="mailto:tctourek@gmail.com">tctourek@gmail.com</a>
            <a href="https://www.instagram.com/tayyylorrrlol/" target="_blank" rel="noopener noreferrer">Instagram</a>
          </p>
        </div>
      </section>

      <section id="cv" class="view simple-page" aria-label="CV">
        <p>CV</p>
      </section>

      <section id="work" class="view" aria-label="Work">
        <div class="work-grid" id="workGrid"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__close" type="button">Close</button>
    <div class="lightbox__inner">
      <img class="lightbox__image" alt="" />
      <p class="lightbox__meta" aria-live="polite">
        <span class="lightbox__meta-title"></span>
        <span class="lightbox__meta-size lightbox__meta-cm"></span>
        <span class="lightbox__meta-size lightbox__meta-in"></span>
      </p>
    </div>
  </div>

  <script>
    const works = [
      {
        title: 'BUILDING A FIRE',
        year: '2025',
        src: './building_a_fire.JPG',
        widthCm: 50.8,
        heightCm: 40.64,
        trimRightOnHome: true
      },
      {
        title: 'CLOUD MOVING FASTER THAN THEY DID YESTERDAY',
        year: '2025',
        src: './cloud_moving_faster_than_they_did_yesterday.JPG',
        widthCm: 20.32,
        heightCm: 20.32
      },
      {
        title: 'MAKING YOU UNDERSTAND EXACTLY',
        year: '2025',
        src: './making_you_understand_exactly.png',
        widthCm: 30.48,
        heightCm: 30.48,
        displayWidthCm: 45.72,
        displayHeightCm: 45.72,
        pngClean: true
      },
      {
        title: 'DIALOGUE 1',
        year: '2025',
        src: './dialogue_1.JPG',
        widthCm: 101.6,
        heightCm: 72,
        displayWidthCm: 101.6,
        displayHeightCm: 72
      },
      {
        title: 'HANDWRITTEN NOTE',
        year: '2025',
        src: './handwritten_note.JPG',
        widthCm: 30.48,
        heightCm: 30.48,
        displayWidthCm: 30.48,
        displayHeightCm: 30.48
      },
      {
        title: 'LYING OFTEN',
        year: '2025',
        src: './lying_often.JPG',
        widthCm: 30.48,
        heightCm: 30.48,
        displayWidthCm: 30.48,
        displayHeightCm: 30.48
      },
      {
        title: 'DARIA',
        year: '2025',
        src: './daria.jpg',
        widthCm: 101,
        heightCm: 101,
        displayWidthCm: 101,
        displayHeightCm: 101
      },
      {
        title: 'MOUTH OPEN WIDE FOR NOTHING IMPORTANT',
        year: '2025',
        src: './mouth_open_wide_for_nothing_important.JPG',
        widthCm: 76.2,
        heightCm: 60.96,
        // Display this work 15% smaller than its real-size scale.
        // Caption and lightbox measurements still show the true dimensions above.
        displayWidthCm: 64.77,
        displayHeightCm: 51.816
      },
      {
        title: 'ONE TIME ONLY',
        year: '2025',
        src: './one_time_only.JPG',
        widthCm: 60.96,
        heightCm: 60.96
      }
    ];

    function formatCm(value) {
      return Number.isInteger(value) ? String(value) : String(value).replace(/\.?0+$/, '');
    }

    function workLabel(work) {
      return `${work.title}, ${work.year}`;
    }

    function formatIn(value) {
      const rounded = Math.round((value / 2.54) * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.?0+$/, '');
    }

    function workSizeText(work) {
      return `${formatCm(work.widthCm)} × ${formatCm(work.heightCm)} cm`;
    }

    function workSizeTextInches(work) {
      return `${formatIn(work.widthCm)} × ${formatIn(work.heightCm)} in`;
    }

    function displayWidth(work) {
      return work.displayWidthCm || work.widthCm;
    }

    function displayHeight(work) {
      return work.displayHeightCm || work.heightCm;
    }

    function applyRealSize(element, work) {
      element.style.setProperty('--display-w-cm', displayWidth(work));
      element.style.setProperty('--display-h-cm', displayHeight(work));
      element.style.setProperty('--display-ratio', `${displayWidth(work)} / ${displayHeight(work)}`);

      if (work.naturalWidth && work.naturalHeight) {
        element.style.setProperty('--natural-ratio', `${work.naturalWidth} / ${work.naturalHeight}`);
      }
    }

    function cacheSafeSrc(src) {
      if (!src) return '';
      const separator = src.includes('?') ? '&' : '?';
      return `${src}${separator}v=20260531g`;
    }

    function preloadWork(work) {
      return new Promise((resolve) => {
        const image = new Image();
        image.decoding = 'async';
        image.onload = () => {
          work.loadedSrc = image.src;
          work.naturalWidth = image.naturalWidth;
          work.naturalHeight = image.naturalHeight;
          resolve(work);
        };
        image.onerror = () => {
          console.warn(`Could not preload image: ${work.src}`);
          work.loadedSrc = cacheSafeSrc(work.src);
          resolve(work);
        };
        image.src = cacheSafeSrc(work.src);
      });
    }

    function preloadAllWorks() {
      const preloaderText = document.querySelector('.preloader__text');
      let loaded = 0;

      return Promise.all(works.map((work) => {
        return preloadWork(work).then((result) => {
          loaded += 1;
          if (preloaderText) {
            preloaderText.textContent = `Loading works ${loaded}/${works.length}`;
          }
          return result;
        });
      }));
    }

    function markImageLoaded(img) {
      if (!img) return;
      img.classList.add('is-loaded');
    }

    function loadWorkImage(img, work) {
      if (!img || !work) return;

      img.classList.remove('is-loaded');
      img.alt = work.title;
      img.loading = 'eager';
      img.decoding = 'async';
      img.onload = () => markImageLoaded(img);
      img.onerror = () => {
        console.warn(`Could not load image: ${work.src}`);
        markImageLoaded(img);
      };
      img.src = work.loadedSrc || cacheSafeSrc(work.src);

      if (img.complete && img.naturalWidth > 0) {
        markImageLoaded(img);
      }
    }

    function createWorkEntry(work) {
      const entry = document.createElement('div');
      entry.className = 'work-entry';
      applyRealSize(entry, work);

      const item = document.createElement('div');
      item.className = [
        'work-item',
        work.pngClean ? 'png-clean' : ''
      ].filter(Boolean).join(' ');

      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `View ${work.title} larger`);

      const img = document.createElement('img');
      img._work = work;
      loadWorkImage(img, work);

      item.appendChild(img);

      const caption = document.createElement('p');
      caption.className = 'work-caption';

      const title = document.createElement('span');
      title.className = 'work-title';
      title.textContent = workLabel(work);

      const details = document.createElement('span');
      details.className = 'work-details';
      details.textContent = workSizeText(work);

      caption.appendChild(title);
      caption.appendChild(details);

      entry.appendChild(item);
      entry.appendChild(caption);

      item.addEventListener('click', () => {
        openLightbox(img, work);
      });

      item.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(img, work);
        }
      });

      return entry;
    }

    const links = document.querySelectorAll('[data-view]');
    const views = document.querySelectorAll('.view');

    function showView(viewName) {
      views.forEach((view) => {
        view.classList.toggle('active', view.id === viewName);
      });

      links.forEach((link) => {
        link.classList.toggle('active', link.dataset.view === viewName);
      });

      history.replaceState(null, '', '#' + viewName);
    }

    links.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        showView(link.dataset.view);
      });
    });

    const workGrid = document.querySelector('#workGrid');
    const homeView = document.querySelector('#home');
    const frontpageWrap = document.querySelector('.image-wrap');
    const frontpageImage = document.querySelector('.frontpage-image');
    const frontpageCaption = document.querySelector('.frontpage-caption');

    let currentFrontpageIndex = 0;
    let frontpageTimer;

    function showFrontpageWork(index) {
      const work = works[index];
      if (!work || !frontpageWrap || !frontpageImage) return;

      currentFrontpageIndex = index;
      applyRealSize(frontpageWrap, work);
      frontpageWrap.classList.toggle('png-clean', Boolean(work.pngClean));
      frontpageWrap.classList.toggle('trim-right', Boolean(work.trimRightOnHome));

      frontpageImage._work = work;
      frontpageImage.alt = work.title;
      frontpageImage.loading = 'eager';
      frontpageImage.decoding = 'async';
      frontpageImage.src = work.loadedSrc || cacheSafeSrc(work.src);

      frontpageCaption.textContent = workLabel(work);
    }

    function nextFrontpageWork() {
      showFrontpageWork((currentFrontpageIndex + 1) % works.length);
    }

    function restartFrontpageTimer() {
      clearInterval(frontpageTimer);
      frontpageTimer = setInterval(nextFrontpageWork, 8000);
    }

    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = document.querySelector('.lightbox__image');
    const lightboxClose = document.querySelector('.lightbox__close');
    const lightboxInner = document.querySelector('.lightbox__inner');
    const lightboxMetaTitle = document.querySelector('.lightbox__meta-title');
    const lightboxMetaCm = document.querySelector('.lightbox__meta-cm');
    const lightboxMetaIn = document.querySelector('.lightbox__meta-in');

    function openLightbox(sourceImage, work) {
      if (!sourceImage || !sourceImage.currentSrc) return;

      const activeWork = work || sourceImage._work;

      lightboxImage.src = sourceImage.currentSrc;
      lightboxImage.alt = sourceImage.alt || '';

      if (activeWork) {
        lightboxMetaTitle.textContent = workLabel(activeWork);
        lightboxMetaCm.textContent = workSizeText(activeWork);
        lightboxMetaIn.textContent = workSizeTextInches(activeWork);
      } else {
        lightboxMetaTitle.textContent = '';
        lightboxMetaCm.textContent = '';
        lightboxMetaIn.textContent = '';
      }

      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lightbox-open');
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
    }

    function initializeSite() {
      works.forEach((work) => {
        workGrid.appendChild(createWorkEntry(work));
      });

      if (homeView && frontpageCaption && frontpageWrap && frontpageImage) {
        showFrontpageWork(0);
        restartFrontpageTimer();

        homeView.addEventListener('click', (event) => {
          if (event.target.closest('a')) return;
          nextFrontpageWork();
          restartFrontpageTimer();
        });
      }

      const startingView = window.location.hash.replace('#', '') || 'home';
      if (document.getElementById(startingView)) {
        showView(startingView);
      }

      document.body.classList.remove('is-loading');
      document.body.classList.add('is-ready');
    }

    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', closeLightbox);

    lightboxInner.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    lightboxImage.addEventListener('click', () => {
      closeLightbox();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
        closeLightbox();
      }
    });

    preloadAllWorks().then(initializeSite);
  </script>
</body>
</html>
